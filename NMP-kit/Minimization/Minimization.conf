###################################################
# MINIMIZATION CONFIGURATION FILE — NMP liquid box #
###################################################

# TOPOLOGY
structure               ../Solvate/NMP-100A.psf           ;# Topology (atoms, bonds, angles) from solvate's output

# COORDINATES
coordinates              ../Solvate/NMP-100A.pdb           ;# Initial atomic coordinates from solvate's output

# INPUT — FORCE FIELD PARAMETERS
paraTypeCharmm           on                     ;# Enables CHARMM-style parameter file interpretation
parameters                ../inputs/par_all36m_prot.prm    ;# load all CHARMM36 files (there was an error when i didn't do this)
parameters                ../inputs/par_all36_na.prm       ;# dna/rna
parameters                ../inputs/par_all36_carb.prm     ;# carbohydrates
parameters                ../inputs/par_all36_lipid.prm    ;# lipides
parameters                ../inputs/par_all36_cgenff.prm   ;# GENERAL (required)
parameters                ../inputs/NMP.prm                ;# NMP-specific supplement, load LAST, after cgenff

# OUTPUT
set outputName            Minimization			;# set output prefix 
outputName                $outputName
binaryoutput              no					;# writes text (not binary) output for human-readable files
binaryrestart             yes					;# restart files will be binary for compactness and precision
outputtiming              1000					;# Frequency (steps) for timing information in log
outputenergies            1000					;# Frequency for energy output
outputpressure            1000					;# Frequency for pressure output
restartfreq               1000					;# Frequency to save restart files (coordinates, velocities, etc.)
dcdfreq                   1000					;# Frequency to write DCD trajectory frames
XSTFreq                   1000					;# Frequency to write cell dimensions (XST) for variable cell runs
	
# INITIAL TEMPERATURE
# no thermostat is needed at this point but we need some constant (~23 deg C)
set temperature           300
temperature                $temperature

# INTEGRATOR
timestep                  2.0                   ;# fs — standard for a system with H atoms 
fullElectFrequency         1					;# How often to compute full electrostatics
nonbondedFreq              1					;# How often to compute nonbonded interactions
exclude                    scaled1-4            ;# CHARMM/CGenFF convention for 1-4 nonbonded scaling
1-4scaling                 1.0

# LONG-RANGE INTERACTIONS SETUP
# CGenFF documentation recommends slightly longer cutoffs than the
# 8/9/12 used for water/argon: 10/12/14 is the common CGenFF choice.
switching                  on
switchdist                 10.0					;# Distance (Å) where switching begins
cutoff                     12.0					;# Distance (Å) where nonbonded interactions are truncated
pairlistdist               14.0					;# Distance for building neighbor lists; should exceed cutoff

# PERIODIC CELL
cellBasisVector1           100.0    0.0    0.0	;# x
cellBasisVector2             0.0  100.0    0.0	;# y
cellBasisVector3             0.0    0.0  100.0	;# z
cellOrigin                    0.0    0.0    0.0	;# origin

wrapAll                    on                   ;# Keep molecules wrapped in the primary cell for clean output

# PME (Particle Mesh Ewald) for long-range electrostatics
PME                        yes					;# Enables PME for long-range electrostatics
PMEGridSpacing             1.0					;# Grid spacing in Å — affects PME accuracy
PMETolerance               10e-6				;# Desired accuracy of PME computation
PMEInterpOrder             4					;# Order of interpolation (spline) for PME — usually 4 is good

# RUN MINIMIZATION
minimize                   10000                 ;# Number of minimization steps
