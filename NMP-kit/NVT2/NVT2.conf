###################################################
# NVT #2 — 4 ns — NMP liquid box                     #
# Fixed volume (locked in at NPT's equilibrated size)  #
# Final stability check / production                   #
###################################################

# TOPOLOGY
structure                 ../Solvate/NMP-100A.psf
coordinates                ../Solvate/NMP-100A.pdb  ;# reference only

# INPUT — FORCE FIELD PARAMETERS (same set/order as previous stages)
paraTypeCharmm             on
parameters                  ../inputs/par_all36m_prot.prm
parameters                  ../inputs/par_all36_na.prm
parameters                  ../inputs/par_all36_carb.prm
parameters                  ../inputs/par_all36_lipid.prm
parameters                  ../inputs/par_all36_cgenff.prm
parameters                  ../inputs/NMP.prm

# CONTINUE FROM NPT
set inputname                 ../NPT/NPT
binCoordinates                 $inputname.restart.coor
binVelocities                   $inputname.restart.vel
extendedSystem                   $inputname.restart.xsc  ;# picks up NPT's equilibrated (relaxed-density) box size

# OUTPUT
set outputName                    NVT2
outputName                         $outputName
binaryoutput                       no
binaryrestart                      yes
outputtiming                       1000
outputenergies                     1000
outputpressure                     1000
restartfreq                        1000
dcdfreq                            1000
XSTFreq                            1000

set temperature                     300
# No "temperature" command — binVelocities above carries real velocities forward.

# INTEGRATOR
timestep                            2.0
fullElectFrequency                   1
nonbondedFreq                        1
exclude                              scaled1-4
1-4scaling                           1.0

# LONG-RANGE INTERACTIONS SETUP
switching                            on
switchdist                           10.0
cutoff                                12.0
pairlistdist                           14.0

# PERIODIC CELL — read from extendedSystem above (fixed for the whole run, no barostat)
wrapAll                               on

# PME
PME                                   yes
PMEGridSpacing                         1.0
PMETolerance                            10e-6
PMEInterpOrder                           4

# TEMPERATURE CONTROL — thermostat only, no barostat (this is what fixes the volume)
langevin                                on
langevinTemp                             $temperature
langevinDamping                           1.0

# RUN — 4 ns at 2 fs/step
run                                      2000000
