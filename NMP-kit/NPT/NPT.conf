###################################################
# NPT — 7 ns — NMP liquid box                       #
# Volume/density relax to equilibrium at ~1 atm      #
###################################################

# TOPOLOGY
structure                 ../Solvate/NMP-100A.psf
coordinates                ../Solvate/NMP-100A.pdb  ;# reference only

# INPUT — FORCE FIELD PARAMETERS (same set/order as Minimization.conf / NVT1.conf)
paraTypeCharmm             on
parameters                  ../inputs/par_all36m_prot.prm
parameters                  ../inputs/par_all36_na.prm
parameters                  ../inputs/par_all36_carb.prm
parameters                  ../inputs/par_all36_lipid.prm
parameters                  ../inputs/par_all36_cgenff.prm
parameters                  ../inputs/NMP.prm

# CONTINUE FROM NVT #1
set inputname                 ../NVT1/NVT1
binCoordinates                 $inputname.restart.coor
binVelocities                   $inputname.restart.vel  ;# real velocities now — NVT1 already thermalized the system
extendedSystem                   $inputname.restart.xsc

# OUTPUT
set outputName                    NPT
outputName                         $outputName
binaryoutput                       no
binaryrestart                      yes
outputtiming                       1000
outputenergies                     1000
outputpressure                     1000
restartfreq                        1000
dcdfreq                            1000
XSTFreq                            1000            ;# watch this file — box volume should flatten out over the run

# TEMPERATURE (used by both thermostat and piston coupling below)
set temperature                     300
# NOTE: no "temperature" command here — binVelocities above already
# supplies real velocities, so we don't want to re-randomize them.

# INTEGRATOR
timestep                            2.0
fullElectFrequency                   1
nonbondedFreq                        1
exclude                              scaled1-4
1-4scaling                           1.0

# LONG-RANGE INTERACTIONS SETUP
switching                            on
switchdist                           10.0
cutoff                                12.0
pairlistdist                           14.0

# PERIODIC CELL — read from extendedSystem above
wrapAll                               on

# PME
PME                                   yes
PMEGridSpacing                         1.0
PMETolerance                            10e-6
PMEInterpOrder                           4

# TEMPERATURE CONTROL
langevin                                on
langevinTemp                             $temperature
langevinDamping                           1.0

# PRESSURE CONTROL — this is what makes it NPT instead of NVT
LangevinPiston                           on
LangevinPistonTarget                      1.01325   ;# ~1 atm
LangevinPistonPeriod                       100
LangevinPistonDecay                         100
LangevinPistonTemp                           $temperature
useflexiblecell                              no      ;# isotropic scaling only — keeps the box cubic

# RUN — 7 ns at 2 fs/step
run                                         3500000
