###################################################
# NVT #1 — 4 ns — NMP liquid box                   #
# Fixed volume (from solvate's 100 A box);          #
# stabilizes temperature after minimization         #
###################################################

# TOPOLOGY
structure                 ../Solvate/NMP-100A.psf
coordinates                ../Solvate/NMP-100A.pdb  ;# reference only

# INPUT — FORCE FIELD PARAMETERS (same set/order as Minimization.conf)
paraTypeCharmm             on
parameters                  ../inputs/par_all36m_prot.prm
parameters                  ../inputs/par_all36_na.prm
parameters                  ../inputs/par_all36_carb.prm
parameters                  ../inputs/par_all36_lipid.prm
parameters                  ../inputs/par_all36_cgenff.prm
parameters                  ../inputs/NMP.prm

# CONTINUE FROM MINIMIZATION
set inputname                ../Minimization/Minimization
binCoordinates               $inputname.restart.coor
#binVelocities                $inputname.restart.vel  ;# minimization has no meaningful velocities — reinitialize instead (see "temperature" below)
extendedSystem                $inputname.restart.xsc  ;# picks up the 100 A periodic box from minimization

# OUTPUT
set outputName                NVT1
outputName                     $outputName
binaryoutput                   no
binaryrestart                  yes
outputtiming                   1000
outputenergies                 1000
outputpressure                 1000
restartfreq                    1000
dcdfreq                        1000
XSTFreq                        1000

# INITIAL TEMPERATURE
# No binVelocities loaded above, so this generates a fresh Maxwell-Boltzmann
# velocity distribution at the target temperature to start real dynamics.
set temperature                 300
temperature                      $temperature

# INTEGRATOR
timestep                        2.0
fullElectFrequency               1
nonbondedFreq                    1
exclude                          scaled1-4
1-4scaling                       1.0

# LONG-RANGE INTERACTIONS SETUP
switching                        on
switchdist                       10.0
cutoff                           12.0
pairlistdist                      14.0

# PERIODIC CELL — read from extendedSystem above, not set explicitly here
wrapAll                          on

# PME
PME                              yes
PMEGridSpacing                    1.0
PMETolerance                       10e-6
PMEInterpOrder                      4

# TEMPERATURE CONTROL — thermostat only, no barostat (fixed volume)
langevin                         on
langevinTemp                      $temperature
langevinDamping                    1.0

# RUN — 4 ns at 2 fs/step
run                               2000000
