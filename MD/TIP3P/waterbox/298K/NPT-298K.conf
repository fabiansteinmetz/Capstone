###################################################
# NPT ENSEMBLE CONFIGURATION FILE                 #
###################################################

# TOPOLOGY
structure               ../toppar/waterbox.psf

# COORDINATES
coordinates             ../toppar/waterbox.pdb

# INPUT
paraTypeCharmm          on
parameters              ../toppar/toppar_water_ions_namd.str
set inputname           ../Minimization/Minimization
binCoordinates          $inputname.restart.coor
#binVelocities          $inputname.restart.vel
extendedSystem	        $inputname.restart.xsc

# OUTPUT AND RESTART
set outputName          NPT-298K
outputName	        $outputName
binaryoutput            no
binaryrestart           yes
outputtiming            1000
outputenergies          1000
outputpressure          1000
restartfreq             1000
dcdfreq                 1000
XSTFreq                 1000
#veldcdfreq             1000 ;# writing velocities to dcd file
#forcedcdfreq           1000 ;# writing forces to dcd file

# INITIAL TEMPERATURE
set temperature         298
temperature             $temperature

# INTEGRATOR
timestep                2.0
fullElectFrequency      1
nonbondedFreq           1
exclude                 scaled1-4
rigidBonds              all

# LONG-RANGE INTERACTIONS SETUP
switching                on
switchdist               8.0
cutoff                   9.0
pairlistdist            12.0

# CELL BOX DIMENSION
if {0} { 
cellbasisvector1       20.00  00.00  00.00
cellbasisvector2       00.00  20.00  00.00
cellbasisvector3       00.00  00.00  20.00
cellOrigin             00.00  00.00  00.00
}

# WRAP ALL ATOMS FOR OUTPUT
wrapAll                on

# PME
PME                     yes
PMEGridspacing 	        1
PMETolerance            10e-6
PMEInterpOrder          4

# TEMPERATURE CONTROL
langevin                on ;# dinamica de Langevin
langevinTemp            $temperature
langevinDamping         1.0 ;# coeficiente de amortiguacion (gamma) of 1/ps

# PRESSURE CONTROL
LangevinPiston          on
LangevinPistonTarget    1.01325 ;#  en bar -> 1 atm
LangevinPistonPeriod    100
LangevinPistonDecay     100
LangevinPistonTemp      $temperature
useflexiblecell         no

# RUN MINIMIZE
run                     500000
