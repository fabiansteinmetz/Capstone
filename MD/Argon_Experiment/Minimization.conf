###################################################
# MINIMIZATION CONFIGURATION FILE                 #
###################################################

# TOPOLOGY
structure               ARG.psf

# COORDINATES
coordinates             ARG.pdb

# INPUT
paraTypeCharmm          on
parameters              argon_toppar.str

# OUTPUT AND RESTART
set outputName          Minimization
outputName	        $outputName
binaryoutput            no
binaryrestart           yes
outputtiming            100
outputenergies          100
outputpressure          100
restartfreq             100
dcdfreq                 100
XSTFreq                 100

# INITIAL TEMPERATURE
set temperature         0 
temperature             $temperature

# INTEGRATOR
timestep                2.0
fullElectFrequency      1
nonbondedFreq           1
exclude                 scaled1-4

# LONG-RANGE INTERACTIONS SETUP
switching                on
switchdist               8.0
cutoff                   9.0
pairlistdist            12.0

# CELL
if {1} { 
cellbasisvector1       22.00  00.00  00.00
cellbasisvector2       00.00  22.00  00.00
cellbasisvector3       00.00  00.00  22.00
cellOrigin             00.00  00.00  00.00
}

# WRAP ALL ATOMS FOR OUTPUT
wrapAll                on

# PME
PME                     yes
PMEGridspacing 	        1
PMETolerance            10e-6
PMEInterpOrder          4

# TEMPERATURE CONTROL
langevin                off ;# dinamica de Langevin
langevinTemp            $temperature
langevinDamping         1.0 ;# coeficiente de amortiguacion (gamma) of 1/ps

# PRESSURE CONTROL
LangevinPiston          off
LangevinPistonTarget    1.01325 ;#  en bar -> 1 atm
LangevinPistonPeriod    100
LangevinPistonDecay     100
LangevinPistonTemp      $temperature
useflexiblecell         no

# RUN MINIMIZE
minimize                5000
