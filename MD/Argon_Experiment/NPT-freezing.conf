###################################################
# FREEZING WITH P-CONSTANT CONFIGURATION FILE     #
###################################################

# TOPOLOGY
structure               ARG.psf

# COORDINATES
coordinates             ARG.pdb

# INPUT
paraTypeCharmm          on
parameters              argon_toppar.str
set inputname           Minimization
binCoordinates          $inputname.restart.coor
#binVelocities          $inputname.restart.vel
extendedSystem	        $inputname.restart.xsc

# OUTPUT AND RESTART
set outputName          NPT-freezing
outputName	        $outputName
binaryoutput            no
binaryrestart           yes
outputtiming            100
outputenergies          100
outputpressure          100
restartfreq             100
dcdfreq                 100
XSTFreq                 100
#veldcdfreq             100 ;# writing velocities to dcd file
#forcedcdfreq           100 ;# writing forces to dcd file

# INITIAL TEMPERATURE
set temperature         150
temperature             $temperature

# INTEGRATOR
timestep                2.0
fullElectFrequency      1
nonbondedFreq           1
exclude                 scaled1-4

# LONG-RANGE INTERACTIONS SETUP
switching                on
switchdist               8.0
cutoff                   9.0
pairlistdist            12.0

# CELL BOX DIMENSION
if {0} { 
cellbasisvector1       22.00  00.00  00.00
cellbasisvector2       00.00  22.00  00.00
cellbasisvector3       00.00  00.00  22.00
cellOrigin             00.00  00.00  00.00
}

# WRAP ALL ATOMS FOR OUTPUT
wrapAll                on

# PME
PME                     yes
PMEGridspacing 	        1
PMETolerance            10e-6
PMEInterpOrder          4

# TEMPERATURE CONTROL
langevin                on ;# dinamica de Langevin
langevinTemp            $temperature
langevinDamping         1.0 ;# coeficiente de amortiguacion (gamma) of 1/ps

# PRESSURE CONTROL
LangevinPiston          on
LangevinPistonTarget    100
LangevinPistonPeriod    100
LangevinPistonDecay     100
LangevinPistonTemp      $temperature
useflexiblecell         no

# RUN freezing
set Temp 80
set barostat 1
set nSteps 600
for {set t 150} {$t >= $Temp} {incr t -1} {run $nSteps;langevintemp $t;if {$barostat} {langevinpistontemp $t}}
